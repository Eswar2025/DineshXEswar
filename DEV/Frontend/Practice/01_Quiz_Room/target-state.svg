<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Quiz room target</title><desc id="desc">A quiz result with 4 out of 5 correct.</desc><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}</style><rect x="0" y="0" width="1200" height="920" rx="0" fill="#0a0a0a" stroke="none"/><path d="M0 72H1200" fill="none" stroke="#3a3a3a"/><rect x="24" y="20" width="32" height="32" rx="8" fill="#fffaf0" stroke="#fffaf0"/><text x="40" y="42" fill="#0a0a0a" font-size="18" font-weight="600" text-anchor="middle">Q</text><text x="68" y="42" fill="#fffaf0" font-size="18" font-weight="600" text-anchor="start">Quiz room</text><text x="1168" y="42" fill="#9a9a9a" font-size="12" font-weight="400" text-anchor="end">FRONTEND FOUNDATIONS</text><text x="270" y="118" fill="#9a9a9a" font-size="11" font-weight="400" text-anchor="start">ONE SMALL STEP AT A TIME</text><text x="270" y="157" fill="#fffaf0" font-size="30" font-weight="600" text-anchor="start">Test the basics.</text><rect x="270" y="188" width="660" height="150" rx="12" fill="#1a1a1a" stroke="#3a3a3a"/><text x="294" y="222" fill="#9a9a9a" font-size="11" font-weight="400" text-anchor="start">YOUR RESULT</text><text x="294" y="278" fill="#fffaf0" font-size="48" font-weight="600" text-anchor="start">4 / 5</text><text x="906" y="274" fill="#fffaf0" font-size="32" font-weight="400" text-anchor="end">80%</text><text x="294" y="312" fill="#9a9a9a" font-size="13" font-weight="400" text-anchor="start">Good work. Review one answer, then try again.</text><path d="M270 354H930" fill="none" stroke="#3a3a3a"/><text x="270" y="374" fill="#fffaf0" font-size="14" font-weight="600" text-anchor="start">Q1  Which element is meant for a clickable action?</text><text x="270" y="395" fill="#9a9a9a" font-size="12" font-weight="400" text-anchor="start">Correct · A, &lt;button&gt;</text><text x="270" y="416" fill="#9a9a9a" font-size="12" font-weight="400" text-anchor="start">Buttons have built-in keyboard behavior.</text><path d="M270 440H930" fill="none" stroke="#3a3a3a"/><text x="270" y="460" fill="#fffaf0" font-size="14" font-weight="600" text-anchor="start">Q2  Which declaration creates a flex container?</text><text x="270" y="481" fill="#9a9a9a" font-size="12" font-weight="400" text-anchor="start">Correct · B, display: flex</text><text x="270" y="502" fill="#9a9a9a" font-size="12" font-weight="400" text-anchor="start">Use display: flex on the parent element.</text><path d="M270 526H930" fill="none" stroke="#3a3a3a"/><text x="270" y="546" fill="#fffaf0" font-size="14" font-weight="600" text-anchor="start">Q3  Which method attaches a click listener?</text><text x="270" y="567" fill="#9a9a9a" font-size="12" font-weight="400" text-anchor="start">Correct · C, addEventListener()</text><text x="270" y="588" fill="#9a9a9a" font-size="12" font-weight="400" text-anchor="start">Listen for events with addEventListener.</text><path d="M270 612H930" fill="none" stroke="#3a3a3a"/><text x="270" y="632" fill="#fffaf0" font-size="14" font-weight="600" text-anchor="start">Q4  Which method converts a JSON string to a JavaScript value?</text><text x="270" y="653" fill="#9a9a9a" font-size="12" font-weight="400" text-anchor="start">Review · You: B / Correct: D, JSON.parse()</text><text x="270" y="674" fill="#9a9a9a" font-size="12" font-weight="400" text-anchor="start">JSON.parse reads JSON text into a value.</text><path d="M270 698H930" fill="none" stroke="#3a3a3a"/><text x="270" y="718" fill="#fffaf0" font-size="14" font-weight="600" text-anchor="start">Q5  Which keyword declares a binding you cannot reassign?</text><text x="270" y="739" fill="#9a9a9a" font-size="12" font-weight="400" text-anchor="start">Correct · A, const</text><text x="270" y="760" fill="#9a9a9a" font-size="12" font-weight="400" text-anchor="start">const blocks reassignment, not object mutation.</text><rect x="270" y="816" width="160" height="40" rx="20" fill="#fffaf0" stroke="#3a3a3a"/><text x="350.0" y="841.0" fill="#0a0a0a" font-size="13" font-weight="600" text-anchor="middle">Retry quiz</text></svg>