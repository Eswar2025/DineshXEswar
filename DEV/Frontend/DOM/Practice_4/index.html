<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Theme Switcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <h1>Theme Switcher</h1>

        id="themeBtn"
        aria-pressed="false"
    -->

  </div>

  <script src="script.js"></script>
</body>
</html>
