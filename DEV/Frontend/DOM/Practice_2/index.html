<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Two-Input Swap Widget</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="widget">
    <div class="field">
      <label for="input-a">Input Field A</label>
      <input type="text" id="inputA" value="100" />
    </div>

    <button class="swap-btn" >&#8646;</button>

    <div class="field">
      <label for="inputB">Input Field B</label>
      <input type="text" id="inputB" value="200" />
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
