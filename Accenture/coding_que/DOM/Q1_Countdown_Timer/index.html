<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="timer-box">
      <h1>Countdown Timer</h1>

      <p class="timer-text">
        Time left:
        <!--
        TASK 1 (HTML):
        Create a <span> element here with
          id="timer10"
          value="10"
        and the text 10 inside it.
        This span shows the countdown number.
      -->
        <span id="timer10" value="10">10</span>
        seconds
      </p>

      <button id="startBtn">Start</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
