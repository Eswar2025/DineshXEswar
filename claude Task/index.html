<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coding Stats — Replica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ambient background glow -->
  <div class="bg-aurora" aria-hidden="true"></div>

  <!-- ===== NAV ===== -->
  <header class="nav-wrap">
    <nav class="nav" aria-label="Primary">
      <button class="nav-link" data-nav="home">
        <svg viewBox="0 0 24 24" class="ic"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-link" data-nav="about">
        <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        <span>About</span>
      </button>
      <button class="nav-link" data-nav="skills">
        <svg viewBox="0 0 24 24" class="ic"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>
        <span>Skills</span>
      </button>
      <button class="nav-link" data-nav="projects">
        <svg viewBox="0 0 24 24" class="ic"><path d="M3 7h6l2 2h10v10H3z"/></svg>
        <span>Projects</span>
      </button>
      <button class="nav-link active" data-nav="stats">
        <svg viewBox="0 0 24 24" class="ic"><path d="M4 20V10M10 20V4M16 20v-7M20 20H3"/></svg>
        <span>Stats</span>
      </button>
      <button class="nav-link" data-nav="contact">
        <svg viewBox="0 0 24 24" class="ic"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <span>Contact</span>
      </button>
    </nav>
  </header>

  <main class="stage">
    <!-- ===== HEADING ===== -->
    <section class="intro">
      <h1 class="title">Coding <span class="grad">Stats</span></h1>
      <span class="title-underline" aria-hidden="true"></span>
      <p class="subtitle">My competitive programming journey across platforms.</p>
      <div class="live-row">
        <span class="live">
          <svg viewBox="0 0 24 24" class="wifi"><path d="M2 8.5a16 16 0 0 1 20 0"/><path d="M5 12a11 11 0 0 1 14 0"/><path d="M8.5 15.5a6 6 0 0 1 7 0"/><circle cx="12" cy="19" r="1.4"/></svg>
          Live
        </span>
        <button class="refresh-btn" id="refreshBtn" title="Refresh stats" aria-label="Refresh stats">
          <svg viewBox="0 0 24 24" class="ic"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
        </button>
      </div>
    </section>

    <!-- ===== SUMMARY CARDS ===== -->
    <section class="summary" aria-label="Summary statistics">
      <article class="stat-card">
        <svg viewBox="0 0 24 24" class="stat-ic"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>
        <div class="stat-num" data-count="2544">0</div>
        <div class="stat-label">Problems Solved</div>
      </article>
      <article class="stat-card">
        <svg viewBox="0 0 24 24" class="stat-ic"><path d="M7 4h10v4a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/><path d="M9 20h6M10 16.5V20M14 16.5V20"/></svg>
        <div class="stat-num" data-count="36">0</div>
        <div class="stat-label">Contests</div>
      </article>
      <article class="stat-card">
        <svg viewBox="0 0 24 24" class="stat-ic"><path d="m12 3 2.6 5.6 6 .8-4.4 4.2 1.1 6L12 17l-5.3 2.6 1.1-6L3.4 9.4l6-.8L12 3Z"/></svg>
        <div class="stat-num" data-count="1905">0</div>
        <div class="stat-label">Best Rating</div>
      </article>
      <article class="stat-card">
        <svg viewBox="0 0 24 24" class="stat-ic"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/><path d="m3 18 9 3 9-3"/></svg>
        <div class="stat-num" data-count="4">0</div>
        <div class="stat-label">Platforms</div>
      </article>
    </section>

    <!-- ===== TABS ===== -->
    <div class="tabs" role="tablist" aria-label="Platforms">
      <span class="tab-pill" id="tabPill" aria-hidden="true"></span>
      <button class="tab active" role="tab" data-platform="leetcode">LeetCode</button>
      <button class="tab" role="tab" data-platform="codeforces">Codeforces</button>
      <button class="tab" role="tab" data-platform="codechef">CodeChef</button>
      <button class="tab" role="tab" data-platform="tuf">TUF</button>
    </div>

    <!-- ===== DETAIL PANEL ===== -->
    <section class="panel" id="panel">
      <div class="panel-head">
        <span class="dot" id="pDot"></span>
        <h2 class="panel-name" id="pName">LeetCode</h2>
        <span class="handle" id="pHandle">@dineshydk</span>
      </div>

      <div class="panel-body">
        <!-- left: metric tiles -->
        <div class="metrics">
          <div class="metric">
            <div class="metric-label">Contest Rating</div>
            <div class="metric-val accent" id="mRating">1905</div>
          </div>
          <div class="metric">
            <div class="metric-label">Contests Attended</div>
            <div class="metric-val" id="mAttended">9</div>
          </div>
          <div class="metric">
            <div class="metric-label">Global Ranking</div>
            <div class="metric-val" id="mRank">#37,225</div>
            <div class="metric-sub" id="mTop">Top 4.26%</div>
          </div>
        </div>

        <!-- center: donut -->
        <div class="donut-wrap">
          <svg viewBox="0 0 200 200" class="donut">
            <circle class="ring-bg" cx="100" cy="100" r="80" />
            <circle class="ring seg-hard"   cx="100" cy="100" r="80" id="segHard" />
            <circle class="ring seg-medium" cx="100" cy="100" r="80" id="segMedium" />
            <circle class="ring seg-easy"   cx="100" cy="100" r="80" id="segEasy" />
          </svg>
          <div class="donut-center">
            <div class="donut-solved" id="dSolved">102</div>
            <div class="donut-total" id="dTotal">/3977</div>
            <div class="donut-tag">✓ Solved</div>
          </div>
        </div>

        <!-- right: difficulty bars -->
        <div class="bars" id="bars"><!-- injected by JS --></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
