<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">Quiz room target</title><desc id="desc">Question two with display flex selected.</desc><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}</style><rect x="0" y="0" width="1200" height="820" rx="0" fill="#0a0a0a" stroke="none"/><path d="M0 72H1200" fill="none" stroke="#3a3a3a"/><rect x="24" y="20" width="32" height="32" rx="8" fill="#fffaf0" stroke="#fffaf0"/><text x="40" y="42" fill="#0a0a0a" font-size="18" font-weight="600" text-anchor="middle">Q</text><text x="68" y="42" fill="#fffaf0" font-size="18" font-weight="600" text-anchor="start">Quiz room</text><text x="1168" y="42" fill="#9a9a9a" font-size="12" font-weight="400" text-anchor="end">FRONTEND FOUNDATIONS</text><text x="270" y="118" fill="#9a9a9a" font-size="11" font-weight="400" text-anchor="start">ONE SMALL STEP AT A TIME</text><text x="270" y="157" fill="#fffaf0" font-size="30" font-weight="600" text-anchor="start">Test the basics.</text><text x="270" y="202" fill="#fffaf0" font-size="14" font-weight="400" text-anchor="start">Question 2 of 5</text><text x="930" y="202" fill="#9a9a9a" font-size="12" font-weight="400" text-anchor="end">2 of 5 answered</text><rect x="270" y="218" width="660" height="6" rx="3" fill="#1a1a1a" stroke="none"/><rect x="270" y="218" width="264.0" height="6" rx="3" fill="#fffaf0" stroke="none"/><rect x="270" y="250" width="660" height="425" rx="12" fill="#0a0a0a" stroke="#3a3a3a"/><text x="294" y="291" fill="#fffaf0" font-size="24" font-weight="600" text-anchor="start">Which declaration creates a flex container?</text><rect x="294" y="320" width="612" height="52" rx="8" fill="#0a0a0a" stroke="#3a3a3a"/><text x="312" y="352" fill="#9a9a9a" font-size="13" font-weight="400" text-anchor="start">A</text><text x="345" y="352" fill="#fffaf0" font-size="15" font-weight="400" text-anchor="start">display: block</text><text x="888" y="352" fill="#fffaf0" font-size="18" font-weight="400" text-anchor="end">○</text><rect x="294" y="387" width="612" height="52" rx="8" fill="#1a1a1a" stroke="#fffaf0"/><text x="312" y="419" fill="#9a9a9a" font-size="13" font-weight="400" text-anchor="start">B</text><text x="345" y="419" fill="#fffaf0" font-size="15" font-weight="400" text-anchor="start">display: flex</text><text x="888" y="419" fill="#fffaf0" font-size="18" font-weight="400" text-anchor="end">●</text><rect x="294" y="454" width="612" height="52" rx="8" fill="#0a0a0a" stroke="#3a3a3a"/><text x="312" y="486" fill="#9a9a9a" font-size="13" font-weight="400" text-anchor="start">C</text><text x="345" y="486" fill="#fffaf0" font-size="15" font-weight="400" text-anchor="start">position: flex</text><text x="888" y="486" fill="#fffaf0" font-size="18" font-weight="400" text-anchor="end">○</text><rect x="294" y="521" width="612" height="52" rx="8" fill="#0a0a0a" stroke="#3a3a3a"/><text x="312" y="553" fill="#9a9a9a" font-size="13" font-weight="400" text-anchor="start">D</text><text x="345" y="553" fill="#fffaf0" font-size="15" font-weight="400" text-anchor="start">align: flex</text><text x="888" y="553" fill="#fffaf0" font-size="18" font-weight="400" text-anchor="end">○</text><rect x="270" y="707" width="120" height="40" rx="20" fill="#0a0a0a" stroke="#3a3a3a"/><text x="330.0" y="732.0" fill="#fffaf0" font-size="13" font-weight="600" text-anchor="middle">Previous</text><rect x="798" y="707" width="132" height="40" rx="20" fill="#fffaf0" stroke="#3a3a3a"/><text x="864.0" y="732.0" fill="#0a0a0a" font-size="13" font-weight="600" text-anchor="middle">Next question</text><text x="270" y="785" fill="#9a9a9a" font-size="12" font-weight="400" text-anchor="start">One answer per question. You can change it later.</text></svg>