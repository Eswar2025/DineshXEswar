<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--
    TASK 1 (HTML):
    The JavaScript needs these ids to find the elements:
      number display -> id="count"
      minus button   -> id="decBtn"
      reset button   -> id="resetBtn"
      plus button    -> id="incBtn"
    Make sure every element has the correct id.
  -->
    <div class="counter">
      <h2>Counter</h2>
      <span class="count-value" id="count">0</span>

      <div class="buttons">
        <button id="decBtn">-</button>
        <button id="resetBtn">Reset</button>
        <button id="incBtn">+</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
