<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1010" viewBox="0 0 390 1010" role="img" aria-labelledby="title desc"><title id="title">Quiz room target</title><desc id="desc">Question two with display flex selected.</desc><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}</style><rect x="0" y="0" width="390" height="1010" rx="0" fill="#0a0a0a" stroke="none"/><path d="M0 72H390" fill="none" stroke="#3a3a3a"/><rect x="24" y="20" width="32" height="32" rx="8" fill="#fffaf0" stroke="#fffaf0"/><text x="40" y="42" fill="#0a0a0a" font-size="18" font-weight="600" text-anchor="middle">Q</text><text x="68" y="42" fill="#fffaf0" font-size="18" font-weight="600" text-anchor="start">Quiz room</text><text x="20" y="118" fill="#9a9a9a" font-size="11" font-weight="400" text-anchor="start">ONE SMALL STEP AT A TIME</text><text x="20" y="157" fill="#fffaf0" font-size="30" font-weight="600" text-anchor="start">Test the basics.</text><text x="20" y="202" fill="#fffaf0" font-size="14" font-weight="400" text-anchor="start">Question 2 of 5</text><text x="370" y="202" fill="#9a9a9a" font-size="12" font-weight="400" text-anchor="end">2 of 5 answered</text><rect x="20" y="218" width="350" height="6" rx="3" fill="#1a1a1a" stroke="none"/><rect x="20" y="218" width="140.0" height="6" rx="3" fill="#fffaf0" stroke="none"/><rect x="20" y="250" width="350" height="476" rx="12" fill="#0a0a0a" stroke="#3a3a3a"/><text x="44" y="291" fill="#fffaf0" font-size="20" font-weight="600" text-anchor="start">Which declaration creates</text><text x="44" y="318" fill="#fffaf0" font-size="20" font-weight="600" text-anchor="start">a flex container?</text><rect x="44" y="342" width="302" height="52" rx="8" fill="#0a0a0a" stroke="#3a3a3a"/><text x="62" y="374" fill="#9a9a9a" font-size="13" font-weight="400" text-anchor="start">A</text><text x="95" y="374" fill="#fffaf0" font-size="15" font-weight="400" text-anchor="start">display: block</text><text x="328" y="374" fill="#fffaf0" font-size="18" font-weight="400" text-anchor="end">○</text><rect x="44" y="409" width="302" height="52" rx="8" fill="#1a1a1a" stroke="#fffaf0"/><text x="62" y="441" fill="#9a9a9a" font-size="13" font-weight="400" text-anchor="start">B</text><text x="95" y="441" fill="#fffaf0" font-size="15" font-weight="400" text-anchor="start">display: flex</text><text x="328" y="441" fill="#fffaf0" font-size="18" font-weight="400" text-anchor="end">●</text><rect x="44" y="476" width="302" height="52" rx="8" fill="#0a0a0a" stroke="#3a3a3a"/><text x="62" y="508" fill="#9a9a9a" font-size="13" font-weight="400" text-anchor="start">C</text><text x="95" y="508" fill="#fffaf0" font-size="15" font-weight="400" text-anchor="start">position: flex</text><text x="328" y="508" fill="#fffaf0" font-size="18" font-weight="400" text-anchor="end">○</text><rect x="44" y="543" width="302" height="52" rx="8" fill="#0a0a0a" stroke="#3a3a3a"/><text x="62" y="575" fill="#9a9a9a" font-size="13" font-weight="400" text-anchor="start">D</text><text x="95" y="575" fill="#fffaf0" font-size="15" font-weight="400" text-anchor="start">align: flex</text><text x="328" y="575" fill="#fffaf0" font-size="18" font-weight="400" text-anchor="end">○</text><rect x="20" y="752" width="120" height="40" rx="20" fill="#0a0a0a" stroke="#3a3a3a"/><text x="80.0" y="777.0" fill="#fffaf0" font-size="13" font-weight="600" text-anchor="middle">Previous</text><rect x="238" y="752" width="132" height="40" rx="20" fill="#fffaf0" stroke="#3a3a3a"/><text x="304.0" y="777.0" fill="#0a0a0a" font-size="13" font-weight="600" text-anchor="middle">Next question</text><text x="20" y="830" fill="#9a9a9a" font-size="12" font-weight="400" text-anchor="start">One answer per question. You can change it later.</text></svg>